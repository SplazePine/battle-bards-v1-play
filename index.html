<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex,nofollow">
<title>Battle Bards - a Splazetown game you can play inside an X post</title>

<!-- ===== X (Twitter) PLAYER CARD =====
     X reads these tags when someone posts a link to THIS page (post this page, never game.html).
     All links point to the live address https://splazepine.github.io/battle-bards-v1-play/
     They must be full https:// links, because X does not run JavaScript.
     publish.py also bumps the version number on EVERY link at once (X and browsers cache). -->
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="Battle Bards">
<meta name="twitter:description" content="A rhythm duel of bards: hit the notes, clash the beams, outplay Emberdrum. Play it right here in the post.">
<meta name="twitter:image" content="https://splazepine.github.io/battle-bards-v1-play/card.png?v=3">
<meta name="twitter:image:alt" content="Pixel art title screen of Battle Bards">
<meta name="twitter:player" content="https://splazepine.github.io/battle-bards-v1-play/game.html?v=3">
<meta name="twitter:player:width" content="480">
<meta name="twitter:player:height" content="480">

<!-- Open Graph tags: other apps (Discord, iMessage, etc.) read these -->
<meta property="og:type" content="website">
<meta property="og:title" content="Battle Bards">
<meta property="og:description" content="A rhythm duel of bards: hit the notes, clash the beams, outplay Emberdrum.">
<meta property="og:image" content="https://splazepine.github.io/battle-bards-v1-play/card.png?v=3">
<meta property="og:url" content="https://splazepine.github.io/battle-bards-v1-play/?v=3">

<style>
  html,body{margin:0;height:100%;background:#120a14;color:#f3e4cc;font:16px system-ui,sans-serif}
  main{max-width:520px;margin:0 auto;padding:24px 16px;text-align:center}
  h1{color:#f2a444}
  .frame{width:100%;max-width:480px;aspect-ratio:1;border:0;border-radius:12px;background:#000}
</style>
</head>
<body>
<main>
  <h1>Battle Bards</h1>
  <p>A rhythm duel of bards: hit the notes, clash the beams, outplay Emberdrum.</p>
  <!-- People who open the link in a normal browser still get to play. -->
  <iframe class="frame" src="game.html?v=3" title="Battle Bards game"
          sandbox="allow-popups allow-same-origin allow-scripts allow-presentation"></iframe>
  <p><a href="game.html?v=3" target="_blank" rel="noopener" style="color:#a8d0dc">Open full screen ↗</a></p>
</main>
</body>
</html>
